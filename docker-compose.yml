version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: cel-mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: context-engineering-lab
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cel-server
    ports:
      - '5001:5001'
    environment:
      PORT: 5001
      MONGODB_URI: mongodb://mongodb:27017/context-engineering-lab
      JWT_SECRET: change-this-secret-in-production
      JWT_EXPIRES_IN: 7d
      NODE_ENV: development
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cel-client
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongodb_data:
